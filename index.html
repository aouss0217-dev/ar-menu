<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>منيو المطعم</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      text-align: center;
    }

    h1 {
      color: #333;
    }

    .item {
      background: white;
      margin: 15px;
      padding: 15px;
      border-radius: 10px;
    }

    button {
      background: #25D366;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
    }

    .qr {
      background: white;
      margin: 20px;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>🍽️ مطعم الذوق</h1>

  <div class="item">
    <h3>🍕 بيتزا</h3>
    <p>السعر: 800 دج</p>
    <button onclick="order('بيتزا - 800 دج')">اطلب عبر واتساب</button>
  </div>

  <div class="item">
    <h3>🍔 برغر</h3>
    <p>السعر: 600 دج</p>
    <button onclick="order('برغر - 600 دج')">اطلب عبر واتساب</button>
  </div>

  <div class="qr">
    <h3>📱 امسح QR لفتح المنيو</h3>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://aouss0217-dev.github.io/ar-menu/">
    <p>امسح بالكاميرا</p>
  </div>

  <script>
    function order(item) {
      let phone = "213555123456"; // رقم واتساب المطعم
      let message = "السلام عليكم، أريد طلب:\n" + item;
      let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
